<div class="app-container">
  <nav class="sidebar">
    <div class="logo">MEU PDF</div>
    <button [class.active]="abaAtiva === 'organizar'" (click)="mudarAba('organizar')">📦 Organizar Páginas</button>
    <button [class.active]="abaAtiva === 'editar'" (click)="mudarAba('editar')">✍️ Editar Texto</button>
    <button [class.active]="abaAtiva === 'visualizar'" (click)="mudarAba('visualizar')">👁️ Visualizar PDF</button>
  </nav>

  <main class="content-area">
    <app-organizar-pdf *ngIf="abaAtiva === 'organizar'"></app-organizar-pdf>
    <app-editar-texto *ngIf="abaAtiva === 'editar'"></app-editar-texto>
    <app-visualizar-pdf *ngIf="abaAtiva === 'visualizar'"></app-visualizar-pdf>
  </main>
</div>
