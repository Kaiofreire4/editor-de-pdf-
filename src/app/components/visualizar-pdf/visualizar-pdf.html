<div class="word-visualizar">

  <!-- FAIXA DE OPÇÕES -->
  <div class="word-ribbon">
    <div class="ribbon-group">
      <div class="ribbon-row">
        <button class="ribbon-btn big" title="Abrir PDF ou DOCX" (click)="fileInputVis.click()"><span class="ico">📂</span><span class="lbl">Abrir</span></button>
        <button class="ribbon-btn big" title="Imprimir" (click)="imprimir()" [disabled]="!documentoCarregado"><span class="ico">🖨️</span><span class="lbl">Imprimir</span></button>
      </div>
      <span class="ribbon-label">Documento</span>
    </div>

    <div class="ribbon-sep"></div>

    <div class="ribbon-group">
      <div class="ribbon-row">
        <button class="ribbon-btn small" title="Zoom out" (click)="ajustarZoom(-0.25)">−</button>
        <button class="ribbon-btn small" title="Zoom in" (click)="ajustarZoom(0.25)">＋</button>
      </div>
      <span class="ribbon-label">Zoom</span>
    </div>
  </div>

  <!-- ÁREA DA PÁGINA -->
   <div class="word-canvas-area" (touchstart)="iniciarToque($event)" (touchend)="finalizarToque($event)">
       <div class="word-page" [class.docx-page]="docxCarregado">
       <canvas #pdfCanvasVis class="pdf-canvas-vis" [style.display]="pdfCarregado ? 'block' : 'none'"></canvas>
        <ng-container *ngIf="docxCarregado">
          @for (pagina of docxPaginas; track $index) {
            <article class="docx-page-sheet">
              <div class="docx-content" [innerHTML]="pagina"></div>
              <span class="docx-page-label">Página {{ $index + 1 }}</span>
            </article>
          }
        </ng-container>
       <div *ngIf="!documentoCarregado" class="empty-state">
         <div class="empty-icon">👁️</div>
         <p class="empty-title">Nenhum documento selecionado para visualização</p>
         <p class="empty-hint">Abra um arquivo <strong>PDF ou DOCX</strong> para ler o documento.</p>
      </div>
    </div>
  </div>

  <!-- BARRA DE STATUS -->
   <div class="word-statusbar viewer-statusbar">
     <div class="status-left viewer-page-nav">
       <button class="status-btn viewer-nav-btn" aria-label="Página anterior" title="Página anterior" [disabled]="!pdfCarregado || paginaAtual <= 1" (click)="mudarPagina(-1)">‹</button>
       <span class="status-item viewer-page-indicator">
         <small *ngIf="pdfCarregado">PÁGINA</small>
         <strong *ngIf="pdfCarregado">{{ paginaAtual }}</strong>
         <span *ngIf="pdfCarregado" class="page-total">de {{ totalPaginas }}</span>
         <span *ngIf="!pdfCarregado">{{ docxCarregado ? nomeArquivo : 'Pronto' }}</span>
       </span>
       <button class="status-btn viewer-nav-btn" aria-label="Próxima página" title="Próxima página" [disabled]="!pdfCarregado || paginaAtual >= totalPaginas" (click)="mudarPagina(1)">›</button>
     </div>
     <div class="status-right viewer-zoom-nav">
       <button class="viewer-zoom-btn" type="button" aria-label="Diminuir zoom" (click)="ajustarZoom(-0.25)">−</button>
       <span class="status-item zoom-value">{{ zoomPercent }}%</span>
       <button class="viewer-zoom-btn" type="button" aria-label="Aumentar zoom" (click)="ajustarZoom(0.25)">＋</button>
     </div>
  </div>

   <input type="file" #fileInputVis style="display: none" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" (change)="onFileSelected($event)" />
</div>
