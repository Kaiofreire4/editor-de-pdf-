<div class="word-visualizar">

  <!-- FAIXA DE OPÇÕES -->
  <div class="word-ribbon">
    <div class="ribbon-group">
      <div class="ribbon-row">
        <button class="ribbon-btn big" title="Abrir PDF" (click)="fileInputVis.click()"><span class="ico">📂</span><span class="lbl">Abrir</span></button>
        <button class="ribbon-btn big" title="Imprimir" (click)="imprimir()" [disabled]="!pdfCarregado"><span class="ico">🖨️</span><span class="lbl">Imprimir</span></button>
      </div>
      <span class="ribbon-label">Documento</span>
    </div>

    <div class="ribbon-sep"></div>

    <div class="ribbon-group">
      <div class="ribbon-row">
        <button class="ribbon-btn small" title="Zoom out" (click)="ajustarZoom(-0.25)">−</button>
        <button class="ribbon-btn small" title="Zoom in" (click)="ajustarZoom(0.25)">＋</button>
      </div>
      <span class="ribbon-label">Zoom</span>
    </div>
  </div>

  <!-- ÁREA DA PÁGINA -->
  <div class="word-canvas-area">
    <div class="word-page">
      <canvas #pdfCanvasVis class="pdf-canvas-vis" [style.display]="pdfCarregado ? 'block' : 'none'"></canvas>
      <div *ngIf="!pdfCarregado" class="empty-state">
        <div class="empty-icon">👁️</div>
        <p class="empty-title">Nenhum PDF selecionado para visualização</p>
        <p class="empty-hint">Clique em <strong>Abrir</strong> na faixa de opções para carregar o documento em modo de leitura.</p>
      </div>
    </div>
  </div>

  <!-- BARRA DE STATUS -->
  <div class="word-statusbar">
    <div class="status-left">
      <button class="status-btn" [disabled]="!pdfCarregado || paginaAtual <= 1" (click)="mudarPagina(-1)">‹</button>
      <span class="status-item">{{ pdfCarregado ? 'Página ' + paginaAtual + ' de ' + totalPaginas : 'Pronto' }}</span>
      <button class="status-btn" [disabled]="!pdfCarregado || paginaAtual >= totalPaginas" (click)="mudarPagina(1)">›</button>
    </div>
    <div class="status-right">
      <span class="status-item clickable" (click)="ajustarZoom(-0.25)">−</span>
      <span class="status-item zoom-value">{{ zoomPercent }}%</span>
      <span class="status-item clickable" (click)="ajustarZoom(0.25)">＋</span>
    </div>
  </div>

  <input type="file" #fileInputVis style="display: none" accept=".pdf" (change)="onFileSelected($event)" />
</div>
