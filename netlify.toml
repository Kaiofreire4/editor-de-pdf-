[build]
  command = "npm run build"
  publish = "dist/pdf-master-web/browser"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/auth/register"
  to = "/.netlify/functions/auth-register"
  status = 200

[[redirects]]
  from = "/api/auth/login"
  to = "/.netlify/functions/auth-login"
  status = 200

[[redirects]]
  from = "/api/auth/me"
  to = "/.netlify/functions/auth-me"
  status = 200

[[redirects]]
  from = "/api/auth/logout"
  to = "/.netlify/functions/auth-logout"
  status = 200

[[redirects]]
  from = "/salvar-pdf"
  to = "/.netlify/functions/salvar-pdf"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
